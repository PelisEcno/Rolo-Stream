name: rolostream
description: RoloStream - Reproductor de anime multiplataforma
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  rolostream_core:
    git:
      url: https://github.com/PelisEcno/rolostream_core
      ref: main

  latanime_plugin:
    git:
      url: https://github.com/PelisEcno/rolostream-plugin-latanime
      ref: main

  animeav1_plugin:
    git:
      url: https://github.com/PelisEcno/rolostream-plugin-animeav1
      ref: main

  jkanime_plugin:
    git:
      url: https://github.com/PelisEcno/rolostream-plugin-jkanime
      ref: main


  # HTTP + cookies (usado por la app y por el plugin)
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Parseo HTML (usado por el plugin)
  html: ^0.15.4

  # UI
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Persistencia
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utilidades
  url_launcher: ^6.3.1
  intl: ^0.19.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
