workflows:
  ios-release:
    name: RoloStream iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # 🧹 1. LIMPIEZA PROFUNDA
      - name: Limpieza profunda
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework
          pod cache clean --all

      # 📦 2. DESCARGAR EL PROXY (v3.0.0)
      - name: Descargar el Proxy (v3.0.0)
        script: |
          echo "Descargando xcframework desde la Release v3.0.0..."
          
          DIRECT_URL="https://github.com/PelisEcno/mediaflow-proxy-light/releases/download/v3.0.0/MediaFlowProxyLight.xcframework.zip"
          
          curl -L -o xcframework.zip "$DIRECT_URL"
          
          FILE_SIZE=$(stat -f%z xcframework.zip)
          echo "Tamaño del archivo: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ El archivo es demasiado pequeño."
            exit 1
          fi
          
          echo "Descomprimiendo en carpeta temporal..."
          mkdir -p tmp_extract
          unzip -q xcframework.zip -d tmp_extract
          
          echo "Creando la estructura correcta del .xcframework..."
          mkdir -p ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework
          
          # Movemos todo el contenido extraído a la nueva carpeta
          mv tmp_extract/* ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework/
          
          # Verificamos que quedó bien armado
          if [ -f "ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework/Info.plist" ] && [ -d "ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework/ios-arm64" ]; then
            echo "✅ Estructura del .xcframework armada correctamente."
          else
            echo "❌ Algo falló al armar la estructura."
            ls -la ios/MediaFlowProxyLight/MediaFlowProxyLight.xcframework/
            exit 1
          fi
          
          rm -rf tmp_extract xcframework.zip

      # 🔥 3. FIREBASE (Opcional, bórralo si no usas Firebase)
      - name: Firebase config (iOS)
        script: |
          if [ -n "$GSI_PLIST_B64" ]; then
            echo "$GSI_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist configurado"
          fi

      - name: Flutter Pub Get
        script: |
          flutter pub get

      # 📝 4. REGISTRAR EL SWIFT EN XCODE
      - name: Registrar MediaFlowBridge.swift en Xcode
        script: |
          cd ios
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          runner_group = project.main_group.find_subpath('Runner', true)
          existing = runner_group.files.find { |f| f.path == 'MediaFlowBridge.swift' }
          unless existing
            file_ref = runner_group.new_file('MediaFlowBridge.swift')
            target.add_file_references([file_ref])
            project.save
            puts "✅ MediaFlowBridge.swift añadido al proyecto"
          else
            puts "✅ MediaFlowBridge.swift ya estaba registrado"
          end
          RUBY

      # 📦 5. INSTALAR PODS
      - name: CocoaPods Install
        script: |
          cd ios
          pod install --repo-update

      # 🏗️ 6. COMPILAR (SIN FIRMA)
      - name: Build iOS (sin firma)
        script: |
          flutter build ios --release --no-codesign

      - name: Crear IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr RoloStream.ipa Payload
          echo "✅ IPA creada correctamente"
          
    artifacts:
      - RoloStream.ipa